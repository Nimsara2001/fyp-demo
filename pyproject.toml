[project]
name = "fyp-demo"
version = "0.1.0"
description = "Side-by-side Sinhala RAG comparison: akshara-kit vs. a naive LangChain baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshara-kit[pdf,docx,sinhala,brain]>=0.1.0",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=5.4",
    "streamlit>=1.38",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "docx2txt>=0.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fyp_demo"]
